map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Resolve the browser-facing host for the backend. FastAPI builds absolute
# redirects (the 307 it emits for a missing trailing slash) from the Host
# header, so forwarding the internal service name ("backend") makes the browser
# chase an unresolvable URL. Behind a TLS-terminating proxy (Azure Container
# Apps, an ALB) the original host survives only in X-Forwarded-Host.
map $http_x_forwarded_host $public_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

# Same idea for the scheme, so redirects behind a TLS-terminating proxy are
# built with the scheme the browser actually used.
map $http_x_forwarded_proto $public_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/v1/messages/ {
        proxy_pass ${BACKEND_URL};

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $public_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;
    }

    location ^~ /api/v1/ {
        proxy_pass ${BACKEND_URL};

        proxy_http_version 1.1;

        proxy_set_header Host $public_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;
    }

    location ^~ /uploads/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $public_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;
    }

    location ^~ /images/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $public_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
