map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Resolve the browser-facing host so backend redirects (the 307 FastAPI emits
# for a missing trailing slash) can be rewritten to the host the browser used.
# Behind a TLS-terminating proxy (Azure App Service, an ALB) the original host
# may survive only in X-Forwarded-Host, so fall back to the incoming Host.
#
# NOTE: this value must NOT be used as the upstream `Host` header. Azure App
# Service routes an incoming request by its Host header, so forwarding the
# browser-facing host here would route the proxied call straight back to this
# frontend app instead of the backend (the request loops and the API returns an
# empty 400). The proxied requests set `Host $proxy_host` and ship the public
# host separately in X-Forwarded-Host; proxy_redirect rewrites any absolute
# Location the backend returns back to this host.
map $http_x_forwarded_host $public_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

# Same idea for the scheme, so redirects behind a TLS-terminating proxy are
# built with the scheme the browser actually used.
map $http_x_forwarded_proto $public_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/v1/messages/ {
        proxy_pass ${BACKEND_URL};

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_redirect ~^(?:https?://[^/]+)(/.*)$ $public_proto://$public_host$1;
    }

    location ^~ /api/v1/ {
        proxy_pass ${BACKEND_URL};

        proxy_http_version 1.1;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_redirect ~^(?:https?://[^/]+)(/.*)$ $public_proto://$public_host$1;
    }

    location ^~ /uploads/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_redirect ~^(?:https?://[^/]+)(/.*)$ $public_proto://$public_host$1;
    }

    location ^~ /images/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_redirect ~^(?:https?://[^/]+)(/.*)$ $public_proto://$public_host$1;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
