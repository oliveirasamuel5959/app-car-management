name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://saas:saas@localhost:5432/car_db
      JWT_SECRET_KEY: ci-only-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      CORS_ORIGINS: http://localhost:5173
      CORS_ALLOW_CREDENTIALS: "true"
      CORS_ALLOW_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      CORS_ALLOW_HEADERS: "*"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      PAYMENT_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: apps/backend
        run: uv sync --frozen

      - name: Backend tests
        working-directory: apps/backend
        run: uv run pytest -q

      - name: Frontend typecheck
        run: npm run check --workspace=web

      - name: Frontend tests
        run: npm run test --workspace=web

      - name: Frontend build
        run: npm run build --workspace=web

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config

      - name: Build backend image
        run: docker build -f apps/backend/Dockerfile .

      - name: Build frontend image
        run: docker build -f apps/web/Dockerfile .
